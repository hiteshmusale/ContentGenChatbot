[project]
name = "pharma-content-chatbot"
version = "0.1.0"
description = "Chat-driven pharma email generation tool (local portfolio project)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "streamlit>=1.38",
    "requests>=2.32",
    "pandas>=3.0.6",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-anthropic>=1.7.6",
    "jinja2>=3.1.6",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.64.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
